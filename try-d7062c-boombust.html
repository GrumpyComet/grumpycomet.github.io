<style>
:root{color-scheme:dark;--bg:#0d0f1f;--panel:#151833;--card:#1c2042;--line:#2b3060;--fg:#eef0ff;--mute:#9aa0c8;--boom:#7dff9b;--warn:#ffc145;--crash:#ff5a5f;--reb:#6fd3b8;--gold:#ffd166;--blue:#6c8cff;
  --f-d:"Bungee","Sora",system-ui,sans-serif;--f-b:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#stage{position:relative;height:40vh;min-height:230px;flex:none;overflow:hidden}
.hud{position:absolute;inset:0 0 auto 0;padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud .nwl{font-size:10px;letter-spacing:.14em;color:#ffffffaa;font-weight:700}
.hud #nw{font-family:var(--f-d);font-size:26px;line-height:1.05;text-shadow:0 2px 0 #0006}
.hud .r{text-align:right;font-size:12px;font-weight:700;line-height:1.5}
.hud .r b{font-size:14px}
.scar{color:#ffb4b6}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-top:1px solid var(--line);padding:0 max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.phase{margin:10px 0 8px;border-radius:14px;padding:9px 12px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.phase .top{display:flex;align-items:baseline;gap:8px}
.phase #phLab{font-family:var(--f-d);font-size:17px;letter-spacing:.04em}
.phase #phSub{font-size:12px;color:var(--mute);flex:1;min-width:0}
.phase #phTime{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.phase .bar{height:3px;background:#ffffff14;border-radius:3px;margin-top:7px;overflow:hidden}
.phase #phBar{height:100%;background:currentColor;transition:width .15s linear}
.phase.boom{color:var(--boom)}.phase.warning{color:var(--warn);border-color:#ffc14566;animation:warnGlow 1.2s ease-in-out infinite}.phase.crash{color:var(--crash);border-color:var(--crash)}.phase.rebuild{color:var(--reb)}
@keyframes warnGlow{50%{box-shadow:0 0 0 3px #ffc14522}}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.gauge{background:var(--card);border-radius:10px;padding:6px 8px;border:1px solid var(--line)}
.gauge .t{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.gauge .t b{color:var(--fg);font-variant-numeric:tabular-nums}
.gauge .m{height:6px;border-radius:6px;background:#ffffff12;margin-top:5px;overflow:hidden}
.gauge .m i{display:block;height:100%;border-radius:6px;transition:width .3s}
#gE{background:linear-gradient(90deg,#ff9ed2,#ff5ac8)}#gI{background:linear-gradient(90deg,#ffd166,#ff8a3d)}#gF{background:linear-gradient(90deg,#ff8a8a,#ff3d4f)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:800 13px var(--f-b);letter-spacing:.06em}
.tabs button.on{background:var(--fg);color:var(--bg)}
.tabs button.alert{color:var(--bg);background:var(--warn);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
#list{flex:none;padding-bottom:16px;display:flex;flex-direction:column;gap:8px}
.panel>*{flex:none}
.seg{display:flex;gap:6px;align-self:flex-end}
.seg button{padding:5px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mute);font:700 12px var(--f-b)}
.seg button.on{color:var(--fg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.card.col{flex-direction:column;align-items:stretch;gap:7px}
.card.locked{opacity:.55;flex-direction:column;align-items:flex-start;gap:4px}
.sw{width:8px;align-self:stretch;border-radius:5px;flex:none}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#ffffff12;color:var(--mute)}
.risk{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.risk.lo{background:#7dff9b22;color:var(--boom)}.risk.md{background:#ffc14522;color:var(--warn)}.risk.hi{background:#ff5a5f22;color:var(--crash)}
.muted{color:var(--mute);font-size:12px;font-weight:600}
.small{font-size:11px}
.ok{color:var(--boom)}
button{cursor:pointer}
button:disabled{opacity:.4}
.buy{flex:none;min-width:96px;border:0;border-radius:12px;padding:8px 10px;background:linear-gradient(180deg,#8dffab,#3fd46a);color:#08240f;font:800 12px var(--f-b);display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #1f8a40}
.buy b{font-size:14px}
.buy .eta{font-style:normal;font-size:10.5px;font-weight:700;opacity:.85}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #1f8a40}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.card button:not(.buy),.btns button{border:1px solid var(--line);background:#2a2f62;color:var(--fg);border-radius:10px;padding:8px 11px;font:700 12px var(--f-b)}
.btns button.ghost{background:transparent}
.btns button.go{background:var(--fg);color:var(--bg);flex:1;font-size:15px;padding:12px}
.meter{height:8px;background:#ffffff12;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#6c8cff,#7dff9b)}
#coach{position:relative;margin:0 0 8px;background:#fff;color:#14163a;border-radius:12px;padding:8px 30px 8px 11px;font-size:12.5px;font-weight:600;line-height:1.35;animation:coachIn .35s ease}
#coach::after{content:"×";position:absolute;right:10px;top:6px;font-size:16px;color:#14163a88}
@keyframes coachIn{from{transform:translateY(8px);opacity:0}}
#toast{position:absolute;left:50%;top:calc(40vh - 46px);transform:translateX(-50%);background:#000c;border:1px solid #ffffff22;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;z-index:6;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#crashTitle{position:absolute;inset:0 0 auto 0;top:13vh;text-align:center;font-family:var(--f-d);font-size:44px;color:#fff;text-shadow:0 4px 0 #a3001b,0 0 30px #ff2d3d;z-index:4;pointer-events:none;animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(2.4);opacity:0}}
#sheet{position:absolute;inset:0;background:#05060fcc;z-index:8;display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.rep{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%;display:flex;flex-direction:column;gap:9px;max-height:92%;overflow-y:auto;animation:coachIn .4s ease}
.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--mute)}
.rep h2{font-family:var(--f-d);font-size:26px;margin:0;color:var(--crash);font-weight:400}
.rep h2 span{color:var(--fg);font-size:18px}
.rep .big{font-size:18px;font-weight:700}.rep .big b{font-family:var(--f-d);font-size:34px;font-weight:400;color:var(--boom);vertical-align:-4px}
.cf{font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px}.cf.good{background:#7dff9b1a;color:var(--boom)}.cf.bad{background:#ffc1451a;color:var(--warn)}
.rep .scar{font-weight:800;background:#ff5a5f1a;border-radius:10px;padding:8px 10px;color:#ffb4b6}
#event{background:linear-gradient(135deg,#2c2f72,#3b2a6b);border:1px solid #8c7bff66;border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;animation:coachIn .3s ease}
#event .et{font-weight:800;font-size:14px;display:flex;justify-content:space-between}
#event .ttl{font-size:11px;color:var(--warn);font-variant-numeric:tabular-nums}
#event .eb{font-size:12.5px;color:#d9dcff;line-height:1.35}
#event .btns button{padding:8px 12px}
#event .btns button.go{flex:0 1 auto;font-size:13px;padding:8px 14px}
#intel{background:var(--card);border:1px solid #ffc14555;border-radius:14px;padding:9px 11px;margin-bottom:8px;display:flex;flex-direction:column;gap:5px}
#intel .ih{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.1em;color:var(--warn);white-space:nowrap}#intel .ih .muted{letter-spacing:0}
.odd{display:grid;grid-template-columns:1fr 70px 34px;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.odd .on{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd .on i{font-style:normal;color:var(--mute);font-weight:600;font-size:11px;margin-left:4px}
.odd .bar{height:6px;border-radius:6px;background:#ffffff12;overflow:hidden}.odd .bar i{display:block;height:100%;background:var(--warn);transition:width .5s}
.odd b{text-align:right;font-variant-numeric:tabular-nums}
.news{display:flex;flex-direction:column;gap:4px;margin-top:3px;border-top:1px solid var(--line);padding-top:6px}
.news .nw{font-size:12px;font-weight:600;color:#d9dcff;line-height:1.3}
.news .nw.fresh{animation:coachIn .4s ease}
.news .nw:not(.fresh){opacity:.6}
.src{font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;margin-right:6px}
.src.reliable{background:#6c8cff33;color:#a9b9ff}.src.rumor{background:#ffffff14;color:var(--mute)}
.bad{color:var(--crash)}
.lnk{color:#a9b9ff;font:700 12px var(--f-b);padding:8px 4px;align-self:center}
.card button.upg{margin-top:5px;border:1px solid #ffd16655;background:#ffd16614;color:var(--gold);border-radius:9px;padding:5px 8px;font:700 11px var(--f-b);text-align:left;max-width:100%}
#gemBtn{pointer-events:auto;margin-top:6px;border:1px solid #ffffff33;background:#0d0f1fb3;color:var(--fg);border-radius:20px;padding:5px 10px;font:800 13px var(--f-b);display:flex;gap:6px;align-items:center}
#gemBtn span{font-size:10px;letter-spacing:.1em;background:var(--gold);color:#2a1d00;border-radius:10px;padding:2px 6px}
#boost{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:84px;font-size:12px;font-weight:800;color:var(--gold);background:#0d0f1fb3;border-radius:12px;padding:3px 8px}
.rep.shop{gap:8px}
.rep .x{background:none;border:0;color:var(--mute);font-size:18px}
.gemrow{font-size:20px;font-weight:700}.gemrow b{font-family:var(--f-d);font-weight:400}
.sec{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--mute);margin-top:4px}
.pass{border:1px solid #ffd16699;background:linear-gradient(135deg,#3a2f12,#2a2350);color:var(--fg);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;font-family:var(--f-b)}
.pass b{font-size:15px;display:flex;justify-content:space-between}.pass em{font-style:normal;color:var(--gold)}
.pass span{font-size:11.5px;color:#d9dcff;font-weight:600;line-height:1.35}
.pass.starter{border-color:#7dff9b88;background:linear-gradient(135deg,#123a24,#2a2350)}
.pass.got{border-style:dashed}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.packs button{position:relative;border:1px solid var(--line);background:#2a2f62;color:var(--fg);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-b)}
.packs button b{font-size:15px}.packs button span{font-size:12px;color:var(--gold);font-weight:800}
.packs button i{position:absolute;top:-7px;right:6px;font-style:normal;font-size:9.5px;font-weight:800;background:var(--crash);color:#fff;border-radius:8px;padding:1px 6px}
.scar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scar .mini{border:0;background:#ffd166;color:#2a1d00;border-radius:9px;padding:5px 9px;font:800 11px var(--f-b);white-space:nowrap}
.adbox .btns{justify-content:center;margin-top:6px}.adbox{padding:0 24px}
.face{width:34px;height:34px;flex:none;display:block;border-radius:50%;overflow:hidden}
.anchor{display:flex;gap:9px;align-items:center;font-size:12.5px;font-weight:600;line-height:1.3;color:#e6e8ff}
.anchor b{color:#ff9fb6}
#quip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(40vh - 58px);z-index:3;display:flex;gap:8px;align-items:center;background:#0d0f1fdd;border:1px solid #ffffff22;border-radius:22px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:600;pointer-events:none;animation:coachIn .3s ease}
#quip b{color:var(--gold);margin-right:4px}
.tyc{display:grid;grid-template-columns:18px 34px 1fr auto;gap:9px;align-items:center;padding:4px 0}
.tyc.me{background:#ffffff0d;border-radius:10px;padding:4px 6px;margin:0 -6px}
.tyc .rk{font-weight:800;color:var(--mute);text-align:center}
.tn{min-width:0;display:flex;flex-direction:column}.tn b{font-size:13px}.tn i{font-style:normal;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tro{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tr{background:#ffffff08;border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:2px;opacity:.6}
.tr.got{opacity:1;border-color:#ffd16688;background:#ffd1661a}
.tr b{font-size:12px}
.tr.gold{border-color:#ffd166;background:linear-gradient(135deg,#ffd16633,#ffd1660d)}
.card .tr button.mini{margin-top:5px;border:1px solid #ffd16666;background:#ffd16614;color:var(--gold);border-radius:8px;padding:4px 6px;font:800 10.5px var(--f-b)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.names input{min-width:0;background:#0d0f1f;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 10px;font:600 13px var(--f-b);user-select:text}.tr span{font-size:10.5px;color:var(--mute);font-weight:600}
.rivs{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:7px}
.rv{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;font-size:12px;font-weight:700}
.trophy{background:linear-gradient(90deg,#ffd16633,#ffd16611);border:1px solid #ffd16688;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--gold)}
.adbtn{margin-top:4px;border:1px solid #6c8cff88;background:linear-gradient(180deg,#2e3a8a,#232a6b);color:var(--fg);border-radius:11px;padding:8px 10px;font:800 13px var(--f-b);text-align:left;display:flex;flex-direction:column;gap:1px}
.adbtn span{font-weight:600;font-size:11px;color:#b9c3ff}
.src.analyst{background:#7dff9b26;color:var(--boom)}
#ad{position:absolute;inset:0;z-index:9;background:#000e;display:flex;align-items:center;justify-content:center}
.adbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.adbox b{font-size:20px}.adn{font-family:var(--f-d);font-size:48px;color:var(--warn)}
.rep .best span:last-child{text-align:right;color:var(--warn);font-weight:700}
.rep h2.fake{color:var(--boom)}
#crashTitle.fake{text-shadow:0 4px 0 #0b6b2a,0 0 30px #7dff9b}
.foot{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px}
.foot button{background:none;border:0;color:var(--mute);font:600 11px var(--f-b)}
</style>
</head>

  <div id="stage">
    <div class="hud"><div><div class="nwl">NET WORTH</div><div id="nw">$0</div><button id="gemBtn" data-shop="1">💎 <b id="gems">0</b> <span>SHOP</span></button><div id="boost" hidden></div></div>
      <div class="r"><div>Cash <b id="cash">$0</b></div><div id="inc" class="ok">+$0/s</div><div class="scar">Scars <b id="scars">0</b> · <span id="bonus">+0%</span></div></div></div>
  </div>

      <div class="gauge"><div class="t">EUPHORIA <b id="gEv">0</b></div><div class="m"><i id="gE"></i></div></div>

      <div class="gauge"><div class="t">FEAR <b id="gFv">0</b></div><div class="m"><i id="gF"></i></div></div>
    </div>
    <div id="event" hidden></div>
    <div id="intel" hidden></div>
    <div id="coach" hidden></div>
    <div class="tabs"><button id="tabB" class="on">BUILD</button><button id="tabP">PROTECT</button><button id="tabC">CITY</button></div>

    <div class="foot"><span class="muted small">Prototype · a cycle takes minutes, not days</span><button id="reset">Restart</button></div>
